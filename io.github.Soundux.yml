app-id: io.github.Soundux
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: soundux-startup
finish-args:
  - --device=dri
  - --socket=pulseaudio
  - --socket=x11
  - --share=network
  - --share=ipc
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=/run/media:ro
  - --filesystem=/media:ro
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-introspection-12.10.json
  - name: libwnck
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
    cleanup:
      - /include
      - /lib/pkgconfig
      - /bin
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libwnck/43/libwnck-43.3.tar.xz
        sha256: 6af8ac41a8f067ade1d3caaed254a83423b5f61ad3f7a460fcacbac2e192bdf7
        x-checker-data:
          type: gnome
          name: libwnck
          versions:
            '>=': '40.0'
          url-template: https://download.gnome.org/sources/libwnck/$major/libwnck-$version.tar.xz
          stable-only: true
  - name: soundux
    buildsystem: cmake-ninja
    config-opts:
      - -DUSE_FLATPAK=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_CXX_FLAGS=-Wno-error=deprecated-declarations
    post-install:
      - install -Dm 644 -t /app/share/metainfo deployment/appstream/io.github.Soundux.metainfo.xml
      # Patch the desktop file to use the wrapper to fix the white screen issue
      - desktop-file-edit --set-key=Exec --set-value='soundux-startup %U' deployment/appstream/io.github.Soundux.desktop
      - install -Dm 644 -t /app/share/applications deployment/appstream/io.github.Soundux.desktop
      - install -Dm 644 deployment/flatpak/icons/io.github.Soundux-256.png /app/share/icons/hicolor/256x256/apps/io.github.Soundux.png
      - install -Dm 755 -t /app/bin soundux-startup
    sources:
      - type: archive
        url: https://github.com/Soundux/Soundux/releases/download/0.2.7/soundux-0.2.7.tar.gz
        sha512: 
          e813be41d324536065a1f98d397027b98a9db504faed7abb074bd0cc6ac65a7804d120cc559c5fa509acf39ff851aa74d02c4da0f3c49ad8f01286cb81776bd3
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Soundux/Soundux/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name|endswith(".tar.gz")) | .browser_download_url
        strip-components: 2
      - type: patch
        paths:
          - guardpp-build-fix.patch
          - pipewire-build-fix.patch
          - webviewpp-build-fix.patch
      - type: file
        path: soundux-startup
      - type: archive
        dest: lib/cpp-httplib
        archive-type: tar-gzip
        url: https://api.github.com/repos/yhirose/cpp-httplib/tarball/v0.67.0
        sha512: 
          4f96f35eb6b5f1d730ba1f295cb3c4b77ce99a234f114b9dce7c4cd4768ce7b48a2d344ca9708c22683bf72ee019b6e1164c0e25f8ff8d346ebe2f43f31b4489
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yhirose/cpp-httplib/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
  - name: yt-dlp
    no-autogen: true
    no-make-install: true
    make-args:
      - yt-dlp
      - PYTHON=/usr/bin/python
    sources:
      - type: archive
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp.tar.gz
        sha512: 
          23f6f149238642ff204f49c93dd697552b035c4dcf416dfe2ad37bcc0e11e6e1b54593bf69735c12b4af904bd3ae975b4602c449a00690992d5fd37e4cd79e19
        x-checker-data:
          type: json
          url: https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest
          version-query: .tag_name
          url-query: .assets[] | select(.name|endswith(".tar.gz")) | .browser_download_url
      - type: file
        path: youtube-dl
    post-install:
      - install -Dm0755 -t /app/bin yt-dlp
      - install -Dm0755 -t /app/bin youtube-dl
